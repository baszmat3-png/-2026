# Uses an existing PostgreSQL database (Render allows only one free database per account).
# The app keeps its own tables (mx_users, mx_user_data) so it can safely share a database with other projects.
services:
  - type: web
    name: masareefi
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
