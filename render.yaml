databases:
  - name: masareefi-db
    plan: free
    region: frankfurt
    databaseName: masareefi
    user: masareefi

services:
  - type: web
    name: masareefi
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: masareefi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
