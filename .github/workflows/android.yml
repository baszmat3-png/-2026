name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      app_url:
        description: 'رابط السيرفر (اتركه فارغاً لاستخدام APP_URL)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building a debug-signed APK."
          fi

      - name: Build APK + AAB
        working-directory: android
        env:
          INPUT_URL: ${{ github.event.inputs.app_url }}
          VAR_URL: ${{ vars.APP_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          URL="${INPUT_URL:-$VAR_URL}"
          URL="${URL:-https://masareefi.onrender.com}"
          echo "Server URL: $URL"
          mkdir -p ../out
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle assembleRelease bundleRelease -PAPP_URL="$URL" -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=1.0.${{ github.run_number }} --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../out/Masareefi.apk
            cp app/build/outputs/bundle/release/app-release.aab ../out/Masareefi.aab
          else
            gradle assembleDebug -PAPP_URL="$URL" -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=1.0.${{ github.run_number }} --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../out/Masareefi.apk
          fi
          echo "APP_URL_USED=$URL" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Masareefi-android
          path: out/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: مصاريفي — Android 1.0.${{ github.run_number }}
          body: |
            تطبيق مصاريفي للأندرويد
            - Masareefi.apk: للتثبيت المباشر على الهاتف
            - Masareefi.aab: للرفع على Google Play
            السيرفر: ${{ env.APP_URL_USED }}
          files: out/*
